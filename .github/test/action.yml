
name: 'test'
description: 'Builds the kernel Image and modules together'

runs:
  using: "composite"
  steps:
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git curl wget python3-pip bc cpio flex bison \
          openssl libelf-dev pahole lz4 zstd unzip p7zip 2to3 python-is-python3 \
          libssl-dev gnupg gperf neofetch libssl-dev clang lld llvm
      shell: bash

    - name: Download AOSP Clang (r487747c)
      run: |
        mkdir -p clang && cd clang
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/3f67b93ee7a50ae2a3cb34cc32d0589415cc0a9c/clang-r536225.tar.gz -O clang.tar.gz
        tar -xf clang.tar.gz
        cd ..
      shell: bash

    - name: Add Clang to PATH
      run: echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"
      shell: bash

    - name: Verify Clang
      run: clang --version
      shell: bash

    - name: Fastfetch
      run: neofetch
      shell: bash

    - name: apply multiple patches
      run: |
        set -e
        for p in pa/*.patch; do
            echo "Applying $p"
            patch -p1 < "$p" || { echo "Failed to apply $p"; exit 1; }
        done
      shell: bash

    - name: Fix tcp_bbr.c Clang constant-logical-operand errors
      run: |
        set -e
        FILE="net/ipv4/tcp_bbr.c"
        sed -i \
          -e 's/bbr_param(sk, ecn_factor) &&/!!bbr_param(sk, ecn_factor) \&\&/' \
          -e 's/bbr->ecn_eligible && bbr_param(sk, ecn_thresh))/bbr->ecn_eligible \&\& !!bbr_param(sk, ecn_thresh))/' \
          -e 's/bbr->ecn_in_round && bbr_param(sk, ecn_factor))/bbr->ecn_in_round \&\& !!bbr_param(sk, ecn_factor))/' \
          "$FILE"
        grep -n '!!bbr_param' "$FILE"

    - name: Generate defconfig
      run: |
        make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
          CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
          gki_defconfig my/*.config
      shell: bash

    - name: Build Image
      run: |
        make ARCH=arm64 LLVM=1 LLVM_IAS=1 \
          CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
          HOSTCFLAGS="-DUSE_PKCS11_ENGINE" \
          O=out -j$(nproc) Image Image.gz
      shell: bash

    - name: mkdir
      run: |
        mkdir -p image
        cp out/arch/arm64/boot/Image image/
        cp out/arch/arm64/boot/Image.gz image/
      shell: bash

    - name: Upload Image artifacts & modules
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: |
          image

    - name: edit config
      shell: bash
      run: |
        ./scripts/config --file out/.config \
          -d MTD_OOPS

    - name: olddefconfig
      run: |
        make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
          CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
          olddefconfig
      shell: bash

    - name: Build module
      run: |
        make ARCH=arm64 LLVM=1 LLVM_IAS=1 \
          CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
          HOSTCFLAGS="-DUSE_PKCS11_ENGINE" \
          O=out -j$(nproc) modules
      shell: bash
    
    - name: mkdir
      run: |
        find out/ -name "*.ko" -exec cp {} . \;
      shell: bash

    - name: Upload Image artifacts & modules
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image-full
        path: |
          image
          *.ko
          


name: 'test'
description: 'Builds the kernel Image and modules together'

runs:
  using: "composite"
  steps:
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git curl wget python3-pip bc cpio flex bison \
          openssl libelf-dev pahole lz4 zstd unzip p7zip 2to3 python-is-python3 \
          libssl-dev gnupg gperf neofetch libssl-dev clang lld
      shell: bash

    - name: Download AOSP Clang (r487747c)
      run: |
        ls
      shell: bash

    - name: Add Clang to PATH
      run: echo "$GITHUB_WORKSPACE/clang/bin" >> "$GITHUB_PATH"
      shell: bash

    - name: Verify Clang
      run: clang --version
      shell: bash

    - name: Fastfetch
      run: neofetch
      shell: bash

    - name: apply multiple patches
      run: |
        set -e
        for p in pa/*.patch; do
            echo "Applying $p"
            patch -p1 < "$p" || { echo "Failed to apply $p"; exit 1; }
        done
      shell: bash

    - name: Generate defconfig
      run: |
        make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
          CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
          gki_defconfig my/*.config
      shell: bash

    - name: Build Image
      run: |
        make ARCH=arm64 LLVM=1 LLVM_IAS=1 \
          CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
          HOSTCFLAGS="-DUSE_PKCS11_ENGINE" \
          O=out -j$(nproc) Image Image.gz
      shell: bash

    - name: mkdir
      run: |
        mkdir -p image
        cp out/arch/arm64/boot/Image image/
        cp out/arch/arm64/boot/Image.gz image/
      shell: bash

    - name: Upload Image artifacts & modules
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image
        path: |
          image

    - name: edit config
      shell: bash
      run: |
        ./scripts/config --file out/.config \
          -d MTD_OOPS

    - name: olddefconfig
      run: |
        make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 \
          CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
          olddefconfig
      shell: bash

    - name: Build module
      run: |
        make ARCH=arm64 LLVM=1 LLVM_IAS=1 \
          CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
          HOSTCFLAGS="-DUSE_PKCS11_ENGINE" \
          O=out -j$(nproc) modules
      shell: bash
    
    - name: mkdir
      run: |
        find out/ -name "*.ko" -exec cp {} . \;
      shell: bash

    - name: Upload Image artifacts & modules
      uses: actions/upload-artifact@v4
      with:
        name: kernel-image-full
        path: |
          image
          *.ko
          
